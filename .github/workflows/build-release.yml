name: Build PegHook Studio

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-14
            artifact: PegHookStudio-mac-arm64
          - name: mac-intel
            os: macos-13
            artifact: PegHookStudio-mac-x86_64
          - name: windows-x64
            os: windows-2022
            artifact: PegHookStudio-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS
        if: runner.os == 'macOS'
        run: bash packaging/build_macos.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
